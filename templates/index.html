<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Hero - 專屬時態文法特訓競技場</title>
    <!-- Meta SEO Tags -->
    <meta name="description" content="個人專屬單字與文法時態特訓網頁，結合RPG冒險要素，讓你在打怪晉級的過程中輕鬆學習英文！">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo" id="siteLogo">
                ⚔️ English Hero <span>v1.0</span>
            </div>
            <nav aria-label="主要導覽">
                <button class="nav-btn active" id="tabBtnArena">特訓競技場</button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main>

        <!-- Arena Tab (特訓競技場) -->
        <section id="tabArena" class="tab-content active">
            <!-- Stats Row -->
            <div class="arena-header">
                <div class="stat-card">
                    <span class="label">當前關卡 等級</span>
                    <span class="val" id="statLevel">Lv.1</span>
                </div>
                <div class="stat-card">
                    <span class="label">冒險經驗值 XP</span>
                    <span class="val" id="statXp">0 / 100</span>
                </div>
                <div class="stat-card" id="streakCard">
                    <span class="label">連續答對 連擊</span>
                    <span class="val" id="statStreak">0 🔥</span>
                </div>
                <div class="stat-card">
                    <span class="label">總冒險得分</span>
                    <span class="val" id="statScore">0</span>
                </div>
            </div>

            <!-- RPG Battleground -->
            <div class="glass-panel" style="margin-bottom: 2rem;">
                <div class="battleground">
                    <!-- Hero Card -->
                    <div class="fighter-card hero" id="heroCard">
                        <div class="avatar-wrapper">🧙‍♂️</div>
                        <div class="fighter-name">英文勇者</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar" id="heroHpBar" style="width: 100%;"></div>
                            <span class="hp-text" id="heroHpText">100 / 100 HP</span>
                        </div>
                    </div>

                    <!-- VS Badge -->
                    <div class="vs-badge">VS</div>

                    <!-- Monster Card -->
                    <div class="fighter-card monster" id="monsterCard">
                        <div class="avatar-wrapper" id="monsterAvatar">👹</div>
                        <div class="fighter-name" id="monsterName">單字小惡魔</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar" id="monsterHpBar" style="width: 100%;"></div>
                            <span class="hp-text" id="monsterHpText">100 / 100 HP</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter Controls -->
            <div class="filter-controls" style="justify-content: center;">
                <div class="filter-group">
                    <label for="filterLevel">特訓時態篩選</label>
                    <select id="filterLevel" onchange="loadNewQuestion()">
                        <option value="現在">現在時態 (Present)</option>
                        <option value="過去">過去時態 (Past)</option>
                        <option value="未來">未來時態 (Future)</option>
                    </select>
                </div>
            </div>

            <!-- Quiz Panel -->
            <div class="glass-panel">
                <div class="question-container">
                    <span class="question-category" id="questionCategory">時態特訓</span>
                    <div class="question-prompt" id="questionPrompt">正在載入特訓題目...</div>
                    <div class="question-detail" id="questionDetail">...</div>
                </div>

                <!-- Answer Buttons -->
                <div class="options-grid" id="optionsGrid">
                    <!-- Option buttons will be dynamically rendered here -->
                </div>

                <!-- Feedback Panel -->
                <div class="feedback-panel" id="feedbackPanel">
                    <div class="feedback-header" id="feedbackHeader">
                        <span id="feedbackIcon">✔️</span> <span id="feedbackTitle">回答正確！</span>
                    </div>
                    <div class="feedback-desc" id="feedbackAnalysis">
                        詳細解析內容...
                    </div>
                    <div class="action-controls">
                        <button class="btn" id="nextQuestionBtn" onclick="loadNewQuestion()">
                            進入下一關 ➔
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Game Over Modal -->
    <div class="game-modal" id="gameOverModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-icon">💀</div>
            <h2 class="modal-title" id="modalTitle">勇者戰敗！</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">你的 HP 歸零了。別氣餒，吸收這次的特訓經驗，下次一定會更強！</p>
            
            <div class="modal-stats">
                <div class="modal-stat-box">
                    <label>最終關卡等級</label>
                    <span class="val" id="modalLevel">Lv.1</span>
                </div>
                <div class="modal-stat-box">
                    <label>最終冒險得分</label>
                    <span class="val" id="modalScore">0</span>
                </div>
            </div>

            <button class="btn btn-danger" style="width: 100%;" onclick="restartGame()">
                重新開始挑戰 ⚔️
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 English Hero 特訓學院. All rights reserved.</p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem; color: var(--text-muted);">本系統使用 SQLite3 作為底層儲存庫</p>
    </footer>

    <!-- App Logic Script -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
